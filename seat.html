<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyLink Airways – Seat Map</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .back { display: inline-block; margin-bottom: 14px; text-decoration: none; }
    .info { color: var(--silver); margin-bottom: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .live { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
            background: rgba(195, 204, 217, .14); color: var(--silver); }
    .live.on { background: var(--ok-bg); color: var(--ok); }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--silver); font-size: 14px; margin-bottom: 18px; }
    .legend span { display: inline-flex; align-items: center; gap: 8px; }
    .legend i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }

    .layout { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }

    .plane { border-radius: 120px 120px 18px 18px; padding: 64px 28px 28px; overflow-x: auto; max-width: 100%; }
    .row     { display: flex; align-items: center; margin: 3px 0; }
    .row-num { width: 26px; text-align: right; margin-right: 10px; color: var(--muted); font-size: 12px; }
    .aisle   { width: 26px; flex-shrink: 0; }
    .seat {
      width: 40px; height: 36px; margin: 2px; flex-shrink: 0;
      border-radius: 8px 8px 5px 5px;
      font: 600 11px var(--font);
      cursor: pointer;
      position: relative;
    }
    .free     { background: rgba(47, 211, 198, .16); color: var(--turq-hi); border: 1px solid rgba(47, 211, 198, .6); }
    .free:hover { background: var(--turq); color: var(--night); }
    .taken    { background: rgba(195, 204, 217, .08); color: rgba(195, 204, 217, .35);
                border: 1px solid rgba(195, 204, 217, .12); cursor: not-allowed; }
    .selected { background: var(--silver-hi); color: var(--royal); border: 1px solid var(--silver-hi); }
    .business::after {
      content: '✦'; position: absolute; top: -7px; right: -5px;
      font-size: 11px; color: var(--gold); text-shadow: 0 0 4px rgba(233, 196, 106, .7);
    }

    .flash { animation: flash 1s ease-out 3; }
    @keyframes flash { 0%   { transform: scale(1.3); box-shadow: 0 0 0 6px rgba(238, 242, 248, .8); }
                       100% { transform: scale(1);   box-shadow: 0 0 0 0 transparent; } }
    @media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--silver-hi); } }

    .book { width: 340px; position: sticky; top: 24px; }
    .choice { color: var(--silver); }
    .choice b { color: var(--silver-hi); }
    .pnr { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: 4px; color: var(--silver-hi); }
    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .book .btn-block { margin-top: 18px; }

    @media (max-width: 720px) {
      .book { width: 100%; position: static; }
      .plane { padding: 48px 12px 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">← All flights</a>
    <h1 id="title">Loading…</h1>
    <div class="info"><span id="info"></span><span class="live" id="live">Connecting…</span></div>

    <div class="legend">
      <span><i style="background:rgba(47,211,198,.16); border:1px solid rgba(47,211,198,.6)"></i>Available</span>
      <span><i style="background:rgba(195,204,217,.08); border:1px solid rgba(195,204,217,.12)"></i>Booked</span>
      <span><i style="background:var(--silver-hi)"></i>Your choice</span>
      <span><b style="color:var(--gold)">✦</b> Business class</span>
    </div>

    <div class="layout">
      <div class="panel plane" id="plane"></div>

      <aside class="panel book">
        <h2>Book a seat</h2>
        <p id="choice" class="choice">Choose an available seat on the map.</p>

        <div id="signInPrompt" hidden>
          <p class="choice">Sign in to book. You'll come straight back to this seat.</p>
          <a class="btn btn-primary btn-block" id="signInLink" href="login.html">Sign in to book</a>
        </div>

        <form id="bookingForm" hidden>
          <div class="name-row">
            <div><label for="firstName">First name</label><input id="firstName" required></div>
            <div><label for="lastName">Last name</label><input id="lastName" required></div>
          </div>
          <label for="email">Email (from your account)</label>
          <input id="email" type="email" readonly>
          <label for="phone">Phone (optional)</label>
          <input id="phone" type="tel">
          <button type="submit" class="btn btn-primary btn-block" id="bookBtn">Book seat</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const flightId = Number(params.get('flight'));
    let flight = null;
    let user = null;
    let selectedSeat = null;
    let lastStatus = null;
    let wantedSeat = params.get('seat');

    const $ = id => document.getElementById(id);

    async function loadSeatMap() {
      const { data: f, error: e1 } = await db
        .from('flight_availability')
        .select('*')
        .eq('flight_id', flightId)
        .single();
      if (e1) { $('title').textContent = "This flight couldn't be loaded"; return; }
      flight = f;

      const { data: seats, error: e2 } = await db
        .from('seat_map')
        .select('seat_id, seat_number, seat_row, seat_letter, seat_class, seat_status')
        .eq('flight_id', flightId)
        .order('seat_row')
        .order('seat_letter');
      if (e2) { $('title').textContent = "The seat map couldn't be loaded"; return; }

      $('title').textContent = `${f.flight_number}: ${f.from_city} to ${f.to_city}`;
      $('info').textContent  = `Departs ${fmt(f.departure_time)}. ${f.seats_available} of ${f.total_seats} seats available.`;

      drawSeats(seats);

      if (wantedSeat) {
        const s = seats.find(x => x.seat_number === wantedSeat && x.seat_status === 'AVAILABLE');
        if (s) selectSeat(s.seat_number, s.seat_class);
        wantedSeat = null;
      }
    }

    function drawSeats(seats) {
      if (selectedSeat) {
        const mine = seats.find(s => s.seat_number === selectedSeat.seat_number);
        if (mine && mine.seat_status === 'BOOKED') {
          showMessage(`Seat ${selectedSeat.seat_number} was just booked by someone else. Choose another seat.`, 'err');
          clearSelection();
        }
      }

      const rows = {};
      seats.forEach(s => { (rows[s.seat_row] = rows[s.seat_row] || []).push(s); });

      let html = '';
      for (const rowNum in rows) {
        const row = rows[rowNum];
        html += `<div class="row"><span class="row-num">${rowNum}</span>`;
        row.forEach((s, i) => {
          if (i === row.length / 2) html += '<span class="aisle"></span>';
          const state = s.seat_status === 'BOOKED' ? 'taken' : 'free';
          const biz   = s.seat_class === 'BUSINESS' ? 'business' : '';
          const sel   = selectedSeat && selectedSeat.seat_number === s.seat_number ? 'selected' : '';
          const flash = lastStatus && lastStatus[s.seat_number] !== s.seat_status ? 'flash' : '';
          html += `<button class="seat ${state} ${biz} ${sel} ${flash}"
                     data-seat="${s.seat_number}" data-class="${s.seat_class}"
                     ${state === 'taken' ? 'disabled' : ''}
                     aria-label="Seat ${s.seat_number}, ${s.seat_class.toLowerCase()}, ${state === 'taken' ? 'booked' : 'available'}"
                     title="${s.seat_number}, ${s.seat_class.toLowerCase()}">${s.seat_number}</button>`;
        });
        html += '</div>';
      }
      $('plane').innerHTML = html;

      lastStatus = {};
      seats.forEach(s => { lastStatus[s.seat_number] = s.seat_status; });

      document.querySelectorAll('.seat.free').forEach(btn => {
        btn.addEventListener('click', () => selectSeat(btn.dataset.seat, btn.dataset.class));
      });
    }

    function selectSeat(seatNumber, seatClass) {
      selectedSeat = { seat_number: seatNumber, seat_class: seatClass };

      document.querySelectorAll('.seat.selected').forEach(b => b.classList.remove('selected'));
      document.querySelector(`.seat[data-seat="${seatNumber}"]`).classList.add('selected');

      const price = seatClass === 'BUSINESS' ? flight.base_fare * 2.5 : Number(flight.base_fare);
      $('choice').innerHTML = `Seat <b>${seatNumber}</b>, ${seatClass.toLowerCase()}, <b>${rupees(price)}</b>`;
      $('message').innerHTML = '';

      if (user) {
        $('bookingForm').hidden = false;
      } else {
        $('signInLink').href = loginUrl('&seat=' + seatNumber);
        $('signInPrompt').hidden = false;
      }
    }

    function clearSelection() {
      selectedSeat = null;
      $('bookingForm').hidden = true;
      $('signInPrompt').hidden = true;
      $('choice').textContent = 'Choose an available seat on the map.';
    }

    function showMessage(text, kind) {
      $('message').innerHTML = `<div class="message ${kind}">${esc(text)}</div>`;
    }

    $('bookingForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const btn = $('bookBtn');
      btn.disabled = true;
      btn.textContent = 'Booking…';

      const { data: pnr, error } = await db.rpc('book_seat', {
        p_flight_id:   flightId,
        p_seat_number: selectedSeat.seat_number,
        p_first_name:  $('firstName').value.trim(),
        p_last_name:   $('lastName').value.trim(),
        p_email:       user.email,
        p_phone:       $('phone').value.trim() || null
      });

      btn.disabled = false;
      btn.textContent = 'Book seat';

      if (error) {
        showMessage(error.message, 'err');
      } else {
        $('message').innerHTML = `<div class="message ok">Booked. Your PNR is<br>
            <span class="pnr">${esc(pnr)}</span><br>
            It's saved in <a href="my-bookings.html">My bookings</a>.</div>`;
        $('bookingForm').hidden = true;
        selectedSeat = null;
        $('choice').textContent = 'Choose another seat to book again.';
      }

      loadSeatMap();
    });

    function listenForChanges() {
      db.channel('flight-' + flightId)
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'booking', filter: `flight_id=eq.${flightId}` },
            () => loadSeatMap())
        .subscribe(status => {
          const badge = $('live');
          if (status === 'SUBSCRIBED') {
            badge.textContent = 'Live: updates by itself';
            badge.className = 'live on';
          } else {
            badge.textContent = 'Not live: refresh to see changes';
            badge.className = 'live';
          }
        });
    }

    (async () => {
      user = await renderHeader('');
      if (user) {
        const meta = user.user_metadata || {};
        $('firstName').value = meta.first_name || '';
        $('lastName').value  = meta.last_name  || '';
        $('email').value     = user.email;
      }
      await loadSeatMap();
      listenForChanges();
    })();
  </script>
</body>
</html>
