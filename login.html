<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyLink Airways – Sign in</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { display: grid; grid-template-columns: 1fr 1fr; }

    .sign-panel {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--panel-line);
    }
    .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 24px;
      color: var(--silver-hi);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand svg { width: 20px; height: 20px; fill: var(--gold); filter: drop-shadow(0 0 4px rgba(233, 196, 106, .7)); }
    .sign-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--panel-line);
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(32px, 4.4vw, 56px);
      line-height: 1;
      color: var(--turq);
    }
    .sign-row:last-child { border-bottom: none; }
    .sign-row .arrow { width: 1.1em; text-align: center; }
    .sign-row.dim { color: rgba(195, 204, 217, .35); }
    .sign-panel p { color: var(--silver); max-width: 34ch; margin: 0; }

    main { display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .box { width: 100%; max-width: 400px; }
    h1 { font-size: 44px; }
    .lede { margin-bottom: 24px; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(8, 18, 58, .55);
      border: 1px solid var(--panel-line);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 8px;
    }
    .tabs button {
      font: inherit; font-weight: 600;
      border: none; background: transparent; color: var(--silver);
      padding: 10px; border-radius: 7px; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: var(--silver-hi); color: var(--royal); }

    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 64px; }
    .show-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      font: inherit; font-size: 14px; font-weight: 600;
      border: none; background: none; color: var(--silver);
      padding: 6px 8px; cursor: pointer; border-radius: 4px;
    }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
    .box .btn-block { margin-top: 22px; }
    .alt { margin-top: 26px; font-size: 15px; color: var(--silver); }
    .signed-in .email { font-weight: 600; color: var(--silver-hi); }
    .signed-in .btn-ghost { margin-top: 12px; }

    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; }
      .sign-panel { padding: 22px 16px; gap: 16px; border-right: none; border-bottom: 1px solid var(--panel-line); }
      .sign-row { font-size: 30px; padding: 6px 0; border-bottom: none; }
      .sign-row.dim, .sign-panel p { display: none; }
      main { padding: 32px 16px 48px; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <aside class="sign-panel">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12.2 7.8 L20 10 L12.2 12.2 L10 20 L7.8 12.2 L0 10 L7.8 7.8 Z"/></svg>SkyLink Airways
    </a>
    <div aria-hidden="true">
      <div class="sign-row dim"><span class="arrow">↑</span>Gates 1–12</div>
      <div class="sign-row"><span class="arrow">→</span><span id="signText">Sign in</span></div>
      <div class="sign-row dim"><span class="arrow">←</span>Baggage claim</div>
    </div>
    <p>Sign in to book seats and keep all your trips in one place.</p>
  </aside>

  <main>
    <div class="box">

      <section id="authView">
        <h1 id="heading">Welcome back</h1>
        <p class="lede" id="lede">Sign in with the email you used to create your account.</p>

        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tabSignIn" aria-selected="true">Sign in</button>
          <button type="button" role="tab" id="tabSignUp" aria-selected="false">Create account</button>
        </div>

        <form id="authForm" novalidate>
          <div class="name-row" id="nameFields" hidden>
            <div>
              <label for="firstName">First name</label>
              <input id="firstName" autocomplete="given-name">
            </div>
            <div>
              <label for="lastName">Last name</label>
              <input id="lastName" autocomplete="family-name">
            </div>
          </div>

          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>

          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required minlength="6">
            <button type="button" class="show-btn" id="showBtn">Show</button>
          </div>
          <p class="hint" id="passwordHint" hidden>At least 6 characters.</p>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <p class="alt">Just looking? <a href="index.html">Browse flights without signing in</a></p>
      </section>

      <section id="signedInView" class="signed-in" hidden>
        <h1>You're signed in</h1>
        <p class="lede">Signed in as <span class="email" id="userEmail"></span></p>
        <button type="button" class="btn btn-primary btn-block" id="continueBtn">Continue</button>
        <button type="button" class="btn btn-ghost btn-block" id="signOutBtn">Sign out</button>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let next = new URLSearchParams(window.location.search).get('next') || 'index.html';
    if (!/^[\w-]+\.html(\?.*)?$/.test(next)) next = 'index.html';

    let mode = 'signin';
    const $ = id => document.getElementById(id);

    function setMode(newMode) {
      mode = newMode;
      const signingUp = mode === 'signup';

      $('tabSignIn').setAttribute('aria-selected', !signingUp);
      $('tabSignUp').setAttribute('aria-selected', signingUp);
      $('nameFields').hidden   = !signingUp;
      $('passwordHint').hidden = !signingUp;

      $('heading').textContent   = signingUp ? 'Create your account' : 'Welcome back';
      $('lede').textContent      = signingUp
        ? 'Your name and email will fill in automatically when you book.'
        : 'Sign in with the email you used to create your account.';
      $('submitBtn').textContent = signingUp ? 'Create account' : 'Sign in';
      $('signText').textContent  = signingUp ? 'Create account' : 'Sign in';
      $('password').autocomplete = signingUp ? 'new-password' : 'current-password';
      $('message').innerHTML = '';
    }
    $('tabSignIn').addEventListener('click', () => setMode('signin'));
    $('tabSignUp').addEventListener('click', () => setMode('signup'));

    $('showBtn').addEventListener('click', () => {
      const hidden = $('password').type === 'password';
      $('password').type = hidden ? 'text' : 'password';
      $('showBtn').textContent = hidden ? 'Hide' : 'Show';
    });

    function showMessage(text, kind) {
      $('message').innerHTML = `<div class="message ${kind}">${esc(text)}</div>`;
    }

    function friendly(error) {
      const m = error.message.toLowerCase();
      if (m.includes('invalid login'))       return 'That email and password don’t match. Check both and try again.';
      if (m.includes('already registered'))  return 'An account with this email already exists. Sign in instead.';
      if (m.includes('email not confirmed')) return 'Confirm your email first: open the link we sent to your inbox.';
      if (m.includes('at least 6'))          return 'Your password needs at least 6 characters.';
      if (m.includes('rate limit'))          return 'Too many attempts. Wait a minute, then try again.';
      return error.message;
    }

    $('authForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const email    = $('email').value.trim().toLowerCase();
      const password = $('password').value;
      const first    = $('firstName').value.trim();
      const last     = $('lastName').value.trim();

      if (!email || !$('email').checkValidity()) return showMessage('Enter a valid email address.', 'err');
      if (password.length < 6)                   return showMessage('Your password needs at least 6 characters.', 'err');
      if (mode === 'signup' && (!first || !last)) return showMessage('Enter your first and last name.', 'err');

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = mode === 'signup' ? 'Creating account…' : 'Signing in…';

      let result;
      if (mode === 'signin') {
        result = await db.auth.signInWithPassword({ email, password });
      } else {
        result = await db.auth.signUp({
          email,
          password,
          options: {
            data: { first_name: first, last_name: last },
            emailRedirectTo: new URL('login.html', window.location.href).href
          }
        });
      }

      btn.disabled = false;
      btn.textContent = mode === 'signup' ? 'Create account' : 'Sign in';

      if (result.error) return showMessage(friendly(result.error), 'err');

      if (mode === 'signup' && !result.data.session) {
        setMode('signin');
        $('password').value = '';
        showMessage(`Account created. We sent a confirmation link to ${email}. Open it, then sign in here.`, 'ok');
        return;
      }

      window.location.href = next;
    });

    async function checkSession() {
      const user = await currentUser();
      $('authView').hidden     = !!user;
      $('signedInView').hidden = !user;
      if (user) $('userEmail').textContent = user.email;
    }

    $('continueBtn').addEventListener('click', () => { window.location.href = next; });
    $('signOutBtn').addEventListener('click', async () => {
      await db.auth.signOut();
      checkSession();
    });

    checkSession();
  </script>
</body>
</html>
